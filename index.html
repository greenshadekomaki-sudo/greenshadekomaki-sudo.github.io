<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GreenShade studio — independent game developer.">
  <title>GreenShade studio — Independent Games</title>
  <!-- Favicon 由 config.js 配置；未设置时使用空图标，避免请求不存在的文件。 -->
  <link id="favicon" rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="./js/config.js?v=20261123-1"></script>
  <script defer src="./js/i18n.js?v=20261123-1"></script>
  <script defer src="./js/games.js?v=20261123-1"></script>
  <script defer src="./js/main.js?v=20261123-1"></script>
</head>
<body id="top">
  <div class="page">
    <header class="header">
      <div id="studio-logo" class="studio-logo"></div>
      <a class="home-link" href="#top" data-i18n="home"></a>
    </header>
    <main>
      <section class="featured" aria-labelledby="featured-title">
        <div id="featured-icon" class="featured-icon"></div>
        <div class="featured-copy">
          <h1 id="featured-title"></h1>
          <p id="featured-description" class="featured-description"></p>
          <a id="play-link" class="play-link"><span id="play-image"></span></a>
        </div>
      </section>
      <section class="games-section" aria-labelledby="games-heading">
        <h2 id="games-heading" data-i18n="gameList"></h2>
        <!-- 游戏卡片统一由 games.js 中的数据生成。 -->
        <div id="game-list" class="game-grid"></div>
      </section>
    </main>
    <footer class="footer">
      <div class="contact"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg><span id="contact"></span></div>
      <p class="copyright">© <span id="year"></span> GreenShade studio. <span data-i18n="rightsReserved">All rights reserved.</span></p>
      <label class="language-control">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20M4 6h16M4 18h16"/></svg>
        <span class="sr-only" data-i18n="language"></span>
        <select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="en">English</option></select>
      </label>
    </footer>
  </div>
</body>
</html>
